name: "multi-hidden-layer-gaussian"
type: "hidden_layer_multi"
genotype: "multi"
mutation_type: "gaussian" 

svd_k: 10
svd_iters: 20
svd_fd_eps: 1e-3
svd_layer: "mid_block"

latent_sigma: 0.4
prompt_embedding_sigma: 0.4
pooled_prompt_embedding_sigma: 0.4

# only used for sd-1-5
hook_proportion: 0.6

# not used
latent_alpha_min: -20
latent_alpha_max: 20
prompt_embedding_alpha_min: -20
prompt_embedding_alpha_max: 20
pooled_prompt_embedding_alpha_min: -20
pooled_prompt_embedding_alpha_max: 20