hydra:
    run:
        dir: ${hydra:runtime.cwd}/output/${generation.prompt}/${algorithm.name}/${algorithm.genotype}/${emitter.name}/${now:%Y-%m-%d_%H%M%S}_${algorithm.seed}
    sweep:
        dir: ${hydra:runtime.cwd}/output/${generation.prompt}/${algorithm.name}
    output_subdir: .

defaults:
  - _self_

# Model configuration
model:
  name: "stabilityai/sd-turbo"
  device: "cuda"  # or "cpu"
  torch_dtype: "float16"  # or "float32"

# Generation parameters
generation:
  prompt: "A bowl of soup that looks like a monster knitted out of wool"
  num_inference_steps: 50
  guidance_scale: 7.5
  negative_prompt: ""
  num_images_per_prompt: 1

# Descriptor Params
descriptor:
  name: "dino-v2"
  project_desc: False
  projection_dim: 2

# Emitter Params
emitter:
  name: "gaussian" # hidden_latent, gaussian
  batch_size: 2
  gaussian:
    latents_sigma: 0.4
    embedding_sigma: 0.2
  hidden_latent:
    mutation_type: "svd"
    alpha_min: -10
    alpha_max: 10
    hook_proportion: 0.6
    svd_k: 10
    svd_iters: 20
    svd_fd_eps: 1e-3
    svd_layer: "mid_block"


# Algorithm configuration
algorithm:
  name: "dns"  # map_elites, dns, cma_es or adam
  seed: 42
  genotype: "embedding" # "embedding" or "latents"
  max_pop_size: 256
  max_iterations: 200
  fitness_threshold: 0.25 # -1 if we don't want to threshold

  map_elites:
    batch_size: 4
    grid_dims: [16, 16]
    grid_ranges:
      - [-50.0, 50.0]
      - [-50.0, 50.0]
    num_init_cvt_samples: 50000
    num_centroids: 1024
    min_descriptor: -50.0
    max_descriptor: 50.0
    with_grad: False
  dns:
    k: 3
    distance_metric: "cosine"


  # adam:
  #   learning_rate: 0.05
  #   max_iterations: 1000
  #   batch_size: 1
  #   with_grad: True

  # cma_es:
  #   population_size: 4
  #   num_best: 2
  #   sigma: 0.1
  #   delay_eigen_decomposition: True
  #   max_iterations: 200
  #   with_grad: False

# Saving params
save_offspring_data: True
save_images: True
save_repertoire_period: 50

# Output configuration
output:
  save_format: "png"

