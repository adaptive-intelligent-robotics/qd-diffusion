hydra:
    run:
        dir: ${hydra:runtime.cwd}/output/${model.name}/${prompt_key}/${algorithm.name}/${emitter.name}/${now:%Y-%m-%d_%H%M%S}_${seed}
    output_subdir: .

defaults:
  - _self_
  - emitter: sdxl-hidden-layer-latent-svd
  - algorithm: dns
  - model: sdxl-turbo

# Generation parameters
prompt: ""
prompt_key: 5
seed: 42

# General algorithm params
max_pop_size: 64
batch_size: 16
max_iterations: 125
fitness_threshold: 0.3  # -1 if we don't want to threshold

# Descriptor Params
descriptor: "dino-v2" # can be "dino-v2" or "dreamsim"

# Saving params
save_offspring_data: False
save_images: False
save_repertoire_period: 25
top_k: 16 # for calculating top-k metrics
wandb_mode: "online" # can be "online", "offline", or "disabled"

