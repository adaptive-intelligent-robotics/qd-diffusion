hydra:
    run:
        dir: ${hydra:runtime.cwd}/output/${model.name}/${algorithm.name}/${emitter.name}/${now:%Y-%m-%d_%H%M%S}_${seed}
    output_subdir: .

defaults:
  - _self_
  - emitter: sdxl-hidden-layer-latent-svd
  - algorithm: dns
  - model: sdxl-turbo

# Generation parameters
prompt: "metal"
seed: 42

# General algorithm params
max_pop_size: 64
batch_size: 16
max_iterations: 625
fitness_threshold: 0.25  # -1 if we don't want to threshold

# Descriptor Params
descriptor: "dino-v2" # can be "dino-v2" or "dreamsim"

# Saving params
save_offspring_data: True
save_images: True
save_repertoire_period: 50
ssim_sample_size: 500 # integer or -1 for full calculation
wandb_mode: "online" # can be "online", "offline", or "disabled"

