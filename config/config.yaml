hydra:
    run:
        dir: ${hydra:runtime.cwd}/output/${generation.prompt}/${algorithm.name}/${now:%Y-%m-%d_%H%M%S}_${algorithm.seed}
    sweep:
        dir: ${hydra:runtime.cwd}/output/${generation.prompt}/${algorithm.name}
    output_subdir: .

defaults:
  - _self_

# Model configuration
model:
  name: "stabilityai/sd-turbo"
  device: "cuda"  # or "cpu"
  torch_dtype: "float16"  # or "float32"

# Generation parameters
generation:
  prompt: "A dog riding a motorbike"
  num_inference_steps: 50
  guidance_scale: 7.5
  negative_prompt: ""
  num_images_per_prompt: 1

# Algorithm configuration
algorithm:
  name: "map_elites"  # map_elites, cma_es or adam
  seed: 42
  descriptor_names: ["layout_and_composition", "light_and_shadow"]
  iso_sigma: 0.05
  line_sigma: 0.1

  cma_es:
    population_size: 4
    num_best: 2
    sigma: 0.1
    delay_eigen_decomposition: True
    max_iterations: 200
    with_grad: False
  map_elites:
    batch_size: 4
    num_init_cvt_samples: 50000
    num_centroids: 1024
    max_iterations: 200
    min_descriptor: 0.0
    max_descriptor: 10.0
    with_grad: False
  adam:
    learning_rate: 0.05
    max_iterations: 1000
    batch_size: 1
    with_grad: True

# Output configuration
output:
  save_format: "png"

